<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none" aria-label="Structural Engineering &amp; Construction Mgmt">
  <defs>
    <linearGradient id="dept-bg" x1="0" y1="0" x2="400" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B98A2E"/>
      <stop offset="100%" stop-color="#8a6420"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#dept-bg)"/>
  <!-- Abstract circuit pattern -->
  <circle cx="200" cy="112" r="60" stroke="#C9A24B" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="112" r="40" stroke="#C9A24B" stroke-width="1.5" opacity="0.3"/>
  <circle cx="200" cy="112" r="20" fill="#C9A24B" opacity="0.2"/>
  <line x1="0" y1="112" x2="400" y2="112" stroke="#C9A24B" stroke-width="1" opacity="0.2"/>
  <line x1="200" y1="0" x2="200" y2="225" stroke="#C9A24B" stroke-width="1" opacity="0.2"/>
  <!-- Label -->
  <text x="200" y="200" font-family="sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.9">Structural Engineering &amp; Construction Mgmt</text>
