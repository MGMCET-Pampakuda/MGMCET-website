<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" aria-label="About MGMCET">
  <defs>
    <linearGradient id="camp-bg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E4EFE7"/>
      <stop offset="100%" stop-color="#A8D8BE"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#camp-bg)"/>
  <!-- Sky -->
  <rect width="800" height="300" fill="#B8D4F0" opacity="0.4"/>
  <!-- Main building -->
  <rect x="100" y="200" width="600" height="320" rx="6" fill="#14513A"/>
  <rect x="250" y="120" width="140" height="400" rx="4" fill="#1A6A4A"/>
  <rect x="420" y="80" width="160" height="440" rx="4" fill="#218A5E"/>
  <!-- Windows -->
  <rect x="130" y="240" width="40" height="50" rx="3" fill="#C9A24B" opacity="0.7"/>
  <rect x="190" y="240" width="40" height="50" rx="3" fill="#C9A24B" opacity="0.7"/>
  <rect x="280" y="160" width="40" height="50" rx="3" fill="#C9A24B" opacity="0.8"/>
  <rect x="340" y="160" width="40" height="50" rx="3" fill="#C9A24B" opacity="0.8"/>
  <rect x="440" y="120" width="40" height="50" rx="3" fill="#C9A24B" opacity="0.8"/>
  <rect x="500" y="120" width="40" height="50" rx="3" fill="#C9A24B" opacity="0.8"/>
  <!-- Ground / grass -->
  <rect x="0" y="500" width="800" height="100" fill="#2bab74" opacity="0.4"/>
  <rect x="0" y="520" width="800" height="80" fill="#1A6A4A" opacity="0.5"/>
  <!-- Trees -->
  <ellipse cx="80" cy="480" rx="55" ry="70" fill="#14513A"/>
  <rect x="73" y="510" width="14" height="70" fill="#0F3D2B"/>
  <ellipse cx="730" cy="490" rx="50" ry="65" fill="#14513A"/>
  <rect x="724" y="520" width="12" height="60" fill="#0F3D2B"/>
  <!-- Label -->
  <text x="400" y="580" font-family="sans-serif" font-size="16" fill="#0F3D2B" text-anchor="middle" opacity="0.7">About MGMCET</text>
</svg>
