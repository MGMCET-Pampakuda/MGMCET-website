<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" aria-label="Hero Slide 3 — Campus Life">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1920" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#071F14"/>
      <stop offset="60%" stop-color="#14513A"/>
      <stop offset="100%" stop-color="#1A6A4A"/>
    </linearGradient>
    <linearGradient id="overlay" x1="0" y1="0" x2="960" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F3D2B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0F3D2B" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <!-- Sky/background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Stylized campus building silhouette -->
  <rect x="400" y="500" width="1200" height="400" rx="8" fill="#14513A" opacity="0.8"/>
  <rect x="600" y="350" width="200" height="550" rx="4" fill="#1A6A4A" opacity="0.9"/>
  <rect x="860" y="280" width="240" height="620" rx="4" fill="#218A5E" opacity="0.85"/>
  <rect x="1100" y="380" width="180" height="520" rx="4" fill="#1A6A4A" opacity="0.9"/>
  <!-- Windows -->
  <rect x="620" y="400" width="30" height="40" rx="2" fill="#C9A24B" opacity="0.5"/>
  <rect x="670" y="400" width="30" height="40" rx="2" fill="#C9A24B" opacity="0.5"/>
  <rect x="880" y="340" width="35" height="45" rx="2" fill="#C9A24B" opacity="0.6"/>
  <rect x="930" y="340" width="35" height="45" rx="2" fill="#C9A24B" opacity="0.6"/>
  <rect x="980" y="340" width="35" height="45" rx="2" fill="#C9A24B" opacity="0.6"/>
  <rect x="1120" y="440" width="30" height="40" rx="2" fill="#C9A24B" opacity="0.5"/>
  <rect x="1160" y="440" width="30" height="40" rx="2" fill="#C9A24B" opacity="0.5"/>
  <!-- Green overlay left-to-right gradient for hero text contrast -->
  <rect width="1920" height="1080" fill="url(#overlay)"/>
  <!-- Ground -->
  <rect x="0" y="900" width="1920" height="180" fill="#071F14" opacity="0.6"/>
  <!-- Tree silhouettes -->
  <ellipse cx="200" cy="860" rx="80" ry="100" fill="#0F3D2B"/>
  <rect x="190" y="900" width="20" height="80" fill="#071F14"/>
  <ellipse cx="1750" cy="880" rx="60" ry="80" fill="#0F3D2B"/>
  <rect x="1742" y="920" width="16" height="60" fill="#071F14"/>
  <!-- Label -->
  <text x="100" y="1050" font-family="sans-serif" font-size="28" fill="#C9A24B" opacity="0.8">Hero Slide 3 — Campus Life</text>
</svg>
